<!DOCTYPE html>
<html>
<head>
  <title>Daily Diamond</title>
  
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/database.js"></script>
  <script src="js/api.js"></script>
  <script src="js/diamondle.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<pre id="output"></pre>

<div class="top-bar">

  <button class="icon-btn" id="backBtn">❮</button>

  
  <div class="title">
    <img src="icon-192_alpha.png" alt="Daily Diamond Logo" class="header-logo">
    <span>Diamondle</span>
  </div>


</div>


<div class="container">
  
  <h3 id="gameTitle">Loading...</h3>

  <div class="input-wrapper">
    <div class="top-input">
      <div class="game-info">
        <div id="gameDate" class="game-date"></div>

        <div class="guess-info">
          <span class="guess-label">Guesses:</span>
          <span id="guessNumber" class="guess-number">0/9</span>
        </div>

      </div>

    </div>

    <input id="search" placeholder="Guess a player..." autocomplete="off">
    <div id="dropdown" class="dropdown"></div>
    <div class="hint-message">
        <div id="message" class="message"></div>
        <div id="hint"></div>
    </div>
  </div>


  <div id="winPopup" class="result-card" style="display:none;">

    <h3 id="winTitle">You Win!</h3>

    <div id="scoreStats" class="score-stats"></div>

    <div class="result-buttons">
      <button onclick="shareResults()">Share</button>
    </div>
    <!---
    <button onclick="shareResults()">Share Results</button>
    <button onclick="closePopup()">Close</button>-->

    <!---
    <button class="leaderboard-btn" onclick="openLeaderboard()">
      View Leaderboard
    </button>-->

  </div>

  <div id="nameStatHeader" class="name-stat-header"></div>

  <div id="lastGuess" class="board"></div>
  <div id="board" class="board"></div>
</div>



</body>
</html>
