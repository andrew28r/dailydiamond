<body>

  
<div class="top-bar">

  <div class="title"></div>
  <div class="title">Daily Diamond</div>

  <div class="menu-wrapper">
    <button class="icon-btn" id="menuBtn">☰</button>

    <div id="menu" class="menu hidden">

      <div class="menu-player" id="menuPlayer">
        Logged in as<br>
        <strong id="menuPlayerId">Loading...</strong>
      </div>
      <div>
        
      </div>

      <button class="menu-btn" id="changeUserBtn">
        Change Username
      </button>

      <button class="menu-btn" onclick="window.location.href='ratings.html'">
        Ratings
      </button>

      <button class="menu-btn" onclick="window.location.href='settings.html'">
        Settings
      </button>

    </div> <!-- menu -->

  </div> <!-- menu-wrapper -->

</div> <!-- top-bar -->

<div class="container">
  <p>The daily Baseball rankings guessing challenge.</p>
  <p id="streakDisplay"></p>
  <button id="playBtn">Play</button>
</div>

<div class="last5games">
  <h4>Last 5 Days</h4>

  <div id="dayButtons" class="day-buttons"></div>
  <button id="calendarButton" title="View Calendar">Previous Games</button>
</div>

<div id="playerIdPopup" class="popup" style="display:none;">
  <div class="popup-content">

    <h2 id="playerIdTitle">Login</h2>

    <input id="username" placeholder="Username..." autocomplete="off">

    <button onclick="submitPlayerId()">Submit</button>

  </div>
</div>

<div id="loginConfirmPopup" class="popup" style="display:none;">
  <div class="popup-content">

    <h2>Account Found</h2>

    <p id="loginConfirmText"></p>

    <button id="loginYesBtn">Login</button>
    <button id="loginNoBtn">Cancel</button>

  </div>
</div>

<div class="leaderboard">
  <h3>Leaderboard</h3>

  <div class="leaderboard-header">
    <span></span>
    <span></span>
    <span>
      <a href="ratings.html">Rating</a>
    </span>
    <span>Wins</span>
  </div>

  <div id="leaderboardList">
    Loading...
  </div>
</div>

<div id="calendarPopup" class="popup hidden">
    <div class="popup-content">

        <div class="calendar-header">

          <button class="icon-btn" id="prevMonth">❮</button>

          <h2 id="calendarMonth"></h2>

          <button class="icon-btn" id="nextMonth">❯</button>

        </div>

        <div id="calendarGrid"></div>

        <button id="closeCalendar">Close</button>

    </div>
</div>
